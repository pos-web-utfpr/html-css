<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Empresa</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Nome da Empresa</h1>
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M3 12h18M3 6h18M3 18h18"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </header>
    <main>
      <div class="card">
        <h3>Flex Padrão</h3>
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
      </div>
      <div class="card">
        <h3>Exemplo de flex-grow</h3>
        <div class="item grow-0">0</div>
        <div class="item grow-1">1</div>
        <div class="item grow-2">2</div>
        <div class="item grow-3">3</div>
        <div class="item grow-4">4</div>
      </div>
      <div class="card">
        <h3>Exemplo de flex-shrink</h3>
        <div class="item shrink-0">0</div>
        <div class="item shrink-1">1</div>
        <div class="item shrink-2">2</div>
        <div class="item shrink-3">3</div>
        <div class="item shrink-4">4</div>
      </div>
      <div class="card">
        <h3>Exemplo de flex-basis</h3>
        <div class="item basis-50">50px</div>
        <div class="item basis-100">100px</div>
        <div class="item basis-150">150px</div>
        <div class="item basis-200">200px</div>
        <div class="item basis-250">250px</div>
      </div>

      <div class="card container-basis">
        <h3>Exemplo de flex-basis com wrap</h3>
        <div class="item basis-50">50px</div>
        <div class="item basis-100">100px</div>
        <div class="item basis-150">150px</div>
        <div class="item basis-200">200px</div>
        <div class="item basis-250">250px</div>
      </div>
    </main>
  </body>
</html>
