<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo de Vídeo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Exemplos de Conteúdo Multimedia</h1>

    <section aria-label="Vídeo local do planeta Terra">
      <h2>Vídeo do planeta Terra</h2>
      <video
        class="player"
        controls
        loop
        muted
        poster="poster.jpg"
        alt="Vídeo do planeta Terra mostrando seu aspecto em órbita"
      >
        <source src="terra.mp4" type="video/mp4" />
        <track
          kind="captions"
          srclang="pt"
          label="Português"
          src="terra.vtt"
          default
        />
        Seu navegador não suporta a tag de vídeo.
      </video>
    </section>

    <section aria-label="Vídeo embed do YouTube">
      <h2>Embed YouTube (lazy loading)</h2>
      <div class="video-embed">
        <iframe
          loading="lazy"
          width="560"
          height="315"
          src="https://www.youtube.com/embed/iJaxgZAsS2w"
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
          "
          allowfullscreen
        ></iframe>
      </div>
    </section>
  </body>
</html>
