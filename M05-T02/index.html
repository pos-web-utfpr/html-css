<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Keyframes Example</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Exemplos de Animações com Keyframes</h1>
    <section>
      <h2>Keyframes com from e to</h2>
      <div class="block1">Bloco 1</div>
    </section>
    <section>
      <h2>Keyframes com porcentagens</h2>
      <div class="block2">Bloco 2</div>
    </section>
    <section>
      <h2>Movimento Orgânico Sequencial</h2>
      <div id="cascade">
        <div class="cascade-block">1</div>
        <div class="cascade-block">2</div>
        <div class="cascade-block">3</div>
        <div class="cascade-block">4</div>
        <div class="cascade-block">5</div>
      </div>
    </section>
    <section id="skeleton">
      <h2>Skeleton Loader</h2>
      <div class="skeleton-card">
        <div class="skeleton-header"></div>
        <div class="skeleton-text"></div>
        <div class="skeleton-text short"></div>
        <div class="skeleton-text"></div>
      </div>
    </section>
  </body>
</html>
