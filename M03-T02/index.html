<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo de Grid Minimalista</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grid-container">
      <div class="grid-item">
        <img
          src="https://plus.unsplash.com/premium_photo-1676496045492-e3c34cfa74e8?q=80&w=876&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Paisagem 1"
        />
      </div>
      <div class="grid-item">
        <img
          src="https://plus.unsplash.com/premium_photo-1676496046656-cdad44276497?q=80&w=876&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Paisagem 2"
        />
      </div>
      <div class="grid-item">
        <img
          src="https://plus.unsplash.com/premium_photo-1676110938392-5479d7971667?q=80&w=1020&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Paisagem 3"
        />
      </div>
      <div class="grid-item">
        <img
          src="https://plus.unsplash.com/premium_photo-1676496045492-e3c34cfa74e8?q=80&w=876&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Paisagem 4"
        />
      </div>
      <div class="grid-item">
        <img
          src="https://plus.unsplash.com/premium_photo-1676110938392-5479d7971667?q=80&w=1020&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Paisagem 5"
        />
      </div>
      <div class="grid-item">
        <img
          src="https://plus.unsplash.com/premium_photo-1676496045492-e3c34cfa74e8?q=80&w=876&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Paisagem 6"
        />
      </div>
    </div>

    <h2>Exemplo com repeat()</h2>
    <div class="grid-repeat">
      <div class="grid-item">
        <img
          src="https://plus.unsplash.com/premium_photo-1676496045492-e3c34cfa74e8?q=80&w=876&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Paisagem 1"
        />
      </div>
      <div class="grid-item">
        <img
          src="https://plus.unsplash.com/premium_photo-1676496046656-cdad44276497?q=80&w=876&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Paisagem 2"
        />
      </div>
      <div class="grid-item">
        <img
          src="https://plus.unsplash.com/premium_photo-1676110938392-5479d7971667?q=80&w=1020&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Paisagem 3"
        />
      </div>
      <div class="grid-item">
        <img
          src="https://plus.unsplash.com/premium_photo-1676496045492-e3c34cfa74e8?q=80&w=876&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Paisagem 4"
        />
      </div>
    </div>

    <h2>Exemplo com auto-fit</h2>
    <div class="grid-auto-fit-new">
      <div class="item" style="background: red">1</div>
      <div class="item" style="background: blue">2</div>
      <div class="item" style="background: green">3</div>
      <div class="item" style="background: yellow">4</div>
      <div class="item" style="background: purple">5</div>
      <div class="item" style="background: orange">6</div>
    </div>

    <h2>Exemplo com auto-fill</h2>
    <div class="grid-auto-fill-new">
      <div class="item" style="background: cyan">1</div>
      <div class="item" style="background: magenta">2</div>
      <div class="item" style="background: lime">3</div>
      <div class="item" style="background: pink">4</div>
      <div class="item" style="background: teal">5</div>
      <div class="item" style="background: brown">6</div>
    </div>
  </body>
</html>
