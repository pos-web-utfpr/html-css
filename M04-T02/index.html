<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Café & Prosa</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <h1>☕ Café & Prosa</h1>
    </header>

    <main>
    <!-- HERO -->
    <section class="hero">
      <div class="hero-text">
        <h2>O melhor café da sua rotina</h2>
        <p>Experimente sabores únicos preparados com paixão e qualidade.</p>
        <button>Ver Cardápio</button>
      </div>

      <div class="hero-image">
        <img
          src="https://images.unsplash.com/photo-1509042239860-f550ce710b93"
          alt="Café"
        />
      </div>
    </section>

    <!-- PRODUTOS -->
    <section class="products">
      <h2>Nossos Cafés</h2>

      <div class="products-grid">
        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1511920170033-f8396924c348"
            alt="Café Espresso"
          />
          <h3>Espresso</h3>
          <p>R$ 8,00</p>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1534778101976-62847782c213"
            alt="Café"
          />
          <h3>Cappuccino</h3>
          <p>R$ 12,00</p>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1593443320739-77f74939d0da"
            alt="Café Latte"
          />
          <h3>Latte</h3>
          <p>R$ 10,00</p>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5"
            alt="Café Mocha"
          />
          <h3>Mocha</h3>
          <p>R$ 14,00</p>
        </div>
      </div>
    </section>
    </main>
  </body>
</html>
